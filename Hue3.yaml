
blueprint:
  name: Philips Hue Dimmer 9290023986 – Zigbee2MQTT
  description: >
    Philips Hue Dimmer Switch 9290023986.
    Direkte Geräteauswahl über MQTT-Geräteauslöser.
    Vier individuell konfigurierbare Tasten.
    Kurzer Tastendruck mit festen Dimmstufen.
    Langer Tastendruck mit kontinuierlichem Dimmen.

  domain: automation

  input:
    dimmer:
      name: Philips Hue Dimmer
      description: Gewünschten Zigbee2MQTT-Schalter auswählen.
      selector:
        device:
          integration: mqtt

    dim_light:
      name: Dimmlampe oder Lichtgruppe
      description: Licht oder Lichtgruppe, die gesteuert werden soll.
      selector:
        entity:
          domain: light

    short_up_step:
      name: HELLER – kurzer Tastendruck
      description: Helligkeitserhöhung in Prozentpunkten.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    short_down_step:
      name: DUNKLER – kurzer Tastendruck
      description: Helligkeitsreduzierung in Prozentpunkten.
      default: 10
      selector:
        number:
          min: 1
          max: 50
          step: 1
          unit_of_measurement: "%"

    hold_step:
      name: Dimmstufe bei langem Tastendruck
      description: Helligkeitsänderung je Hold-Ereignis.
      default: 3
      selector:
        number:
          min: 1
          max: 20
          step: 1
          unit_of_measurement: "%"

    on_action:
      name: EIN – kurzer Tastendruck
      default: []
      selector:
        action:

    off_action:
      name: AUS – kurzer Tastendruck
      default: []
      selector:
        action:

variables:
  hold_step: !input hold_step

trigger:
  # EIN
  - platform: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: on_press_release
    id: on_short

  # HELLER kurz
  - platform: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: up_press_release
    id: up_short

  # DUNKLER kurz
  - platform: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: down_press_release
    id: down_short

  # AUS
  - platform: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: off_press_release
    id: off_short

  # HELLER lang
  - platform: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: up_hold
    id: up_hold

  # DUNKLER lang
  - platform: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: down_hold
    id: down_hold

action:
  - choose:

      # EIN – individuelle Aktion
      - conditions:
          - condition: trigger
            id: on_short
        sequence: !input on_action

      # AUS – individuelle Aktion
      - conditions:
          - condition: trigger
            id: off_short
        sequence: !input off_action

      # HELLER – kurzer Tastendruck
      - conditions:
          - condition: trigger
            id: up_short
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input dim_light
            data:
              brightness_step_pct: !input short_up_step

      # DUNKLER – kurzer Tastendruck
      - conditions:
          - condition: trigger
            id: down_short
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input dim_light
            data:
              brightness_step_pct: >
                {{ 0 - (short_down_step | int) }}

      # HELLER – langer Tastendruck
      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input dim_light
            data:
              brightness_step_pct: "{{ hold_step | int }}"

      # DUNKLER – langer Tastendruck
      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input dim_light
            data:
              brightness_step_pct: "{{ 0 - (hold_step | int) }}"

mode: queued
max: 20
max_exceeded: silent
