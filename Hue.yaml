
blueprint:
  name: Philips Hue Dimmer 9290023986 – Zigbee2MQTT
  description: >
    Philips Hue Dimmer Switch, Modell 9290023986.
    Vier frei konfigurierbare Tastenaktionen.
    Heller und Dunkler dimmen bei langem Tastendruck.
    Kurz- und Langdruck werden sauber unterschieden.

  domain: automation

  input:
    mqtt_topic:
      name: Zigbee2MQTT MQTT Topic
      description: >
        Beispiel: zigbee2mqtt/Hue Dimmer
        Ohne /action am Ende.
      selector:
        text:

    dim_light:
      name: Dimmlampe
      description: Licht oder Lichtgruppe
      selector:
        entity:
          domain: light

    dim_step:
      name: Dimmstufe
      description: Helligkeitsänderung pro Hold-Ereignis
      default: 5
      selector:
        number:
          min: 1
          max: 25
          step: 1
          unit_of_measurement: "%"

    on_action:
      name: EIN – kurzer Tastendruck
      default: []
      selector:
        action:

    up_action:
      name: HELLER – kurzer Tastendruck
      default: []
      selector:
        action:

    down_action:
      name: DUNKLER – kurzer Tastendruck
      default: []
      selector:
        action:

    off_action:
      name: AUS – kurzer Tastendruck
      default: []
      selector:
        action:

trigger:
  # Kurze Tastendrücke: erst beim Loslassen
  - platform: mqtt
    topic: !input mqtt_topic
    value_template: "{{ value_json.action }}"
    payload: on_press_release
    id: on_short

  - platform: mqtt
    topic: !input mqtt_topic
    value_template: "{{ value_json.action }}"
    payload: up_press_release
    id: up_short

  - platform: mqtt
    topic: !input mqtt_topic
    value_template: "{{ value_json.action }}"
    payload: down_press_release
    id: down_short

  - platform: mqtt
    topic: !input mqtt_topic
    value_template: "{{ value_json.action }}"
    payload: off_press_release
    id: off_short

  # Langer Tastendruck: wiederholte Hold-Ereignisse
  - platform: mqtt
    topic: !input mqtt_topic
    value_template: "{{ value_json.action }}"
    payload: up_hold
    id: up_hold

  - platform: mqtt
    topic: !input mqtt_topic
    value_template: "{{ value_json.action }}"
    payload: down_hold
    id: down_hold

action:
  - choose:

      # EIN
      - conditions:
          - condition: trigger
            id: on_short
        sequence: !input on_action

      # HELLER kurz
      - conditions:
          - condition: trigger
            id: up_short
        sequence: !input up_action

      # DUNKLER kurz
      - conditions:
          - condition: trigger
            id: down_short
        sequence: !input down_action

      # AUS
      - conditions:
          - condition: trigger
            id: off_short
        sequence: !input off_action

      # HELLER halten
      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input dim_light
            data:
              brightness_step_pct: !input dim_step

      # DUNKLER halten
      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - action: light.turn_on
            target:
              entity_id: !input dim_light
            data:
              brightness_step_pct: >
                {{ 0 - (dim_step | int) }}

mode: queued
max: 20
max_exceeded: silent
