
blueprint:
  name: Philips Hue Dimmer 9290023986 – Zigbee2MQTT
  description: >
    Philips Hue Dimmer Switch 9290023986.
    Direkte Geräteauswahl über MQTT-Geräteauslöser.
    Vier individuell konfigurierbare Tasten.
    Heller und Dunkler dimmen kontinuierlich bei langem Tastendruck.

  domain: automation

  input:
    dimmer:
      name: Philips Hue Dimmer
      description: Den gewünschten Schalter auswählen.
      selector:
        device:
          integration: mqtt

    dim_light:
      name: Dimmlampe
      description: Lampe oder Lichtgruppe zum Dimmen.
      selector:
        entity:
          domain: light

    dim_step:
      name: Dimmstufe
      description: Helligkeitsänderung pro Schritt.
      default: 3
      selector:
        number:
          min: 1
          max: 20
          step: 1
          unit_of_measurement: "%"

    dim_interval:
      name: Dimmgeschwindigkeit
      description: Zeit zwischen den Helligkeitsänderungen.
      default: 0.25
      selector:
        number:
          min: 0.1
          max: 1
          step: 0.05
          unit_of_measurement: Sekunden

    on_action:
      name: EIN – kurzer Tastendruck
      default: []
      selector:
        action:

    up_action:
      name: HELLER – kurzer Tastendruck
      default: []
      selector:
        action:

    down_action:
      name: DUNKLER – kurzer Tastendruck
      default: []
      selector:
        action:

    off_action:
      name: AUS – kurzer Tastendruck
      default: []
      selector:
        action:

variables:
  dim_step: !input dim_step

triggers:
  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: on_press_release
    id: on_short

  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: up_press_release
    id: up_short

  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: down_press_release
    id: down_short

  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: off_press_release
    id: off_short

  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: up_hold
    id: up_hold

  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: up_hold_release
    id: up_release

  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: down_hold
    id: down_hold

  - trigger: device
    domain: mqtt
    device_id: !input dimmer
    type: action
    subtype: down_hold_release
    id: down_release

actions:
  - choose:

      - conditions:
          - condition: trigger
            id: on_short
        sequence: !input on_action

      - conditions:
          - condition: trigger
            id: up_short
        sequence: !input up_action

      - conditions:
          - condition: trigger
            id: down_short
        sequence: !input down_action

      - conditions:
          - condition: trigger
            id: off_short
        sequence: !input off_action

      # HELLER halten
      - conditions:
          - condition: trigger
            id: up_hold
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input dim_light
                  data:
                    brightness_step_pct: "{{ dim_step | int }}"
                - delay:
                    seconds: !input dim_interval

      # DUNKLER halten
      - conditions:
          - condition: trigger
            id: down_hold
        sequence:
          - repeat:
              while:
                - condition: template
                  value_template: "{{ true }}"
              sequence:
                - action: light.turn_on
                  target:
                    entity_id: !input dim_light
                  data:
                    brightness_step_pct: "{{ 0 - (dim_step | int) }}"
                - delay:
                    seconds: !input dim_interval

      # Loslassen beendet den Dimmvorgang.
      # Die Automation wird durch mode: restart neu gestartet.
      - conditions:
          - condition: trigger
            id:
              - up_release
              - down_release
        sequence: []

mode: restart
max_exceeded: silent
